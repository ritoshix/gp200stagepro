<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#151B2B" />
      <stop offset="100%" stop-color="#0B0F19" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D4FF" />
      <stop offset="100%" stop-color="#A78BFA" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Rounded Square -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" stroke="#2A364F" stroke-width="8"/>

  <!-- Audio Waveform Graphic in Background -->
  <g opacity="0.25" stroke="#00D4FF" stroke-width="6" stroke-linecap="round">
    <line x1="100" y1="256" x2="100" y2="340" />
    <line x1="150" y1="200" x2="150" y2="312" />
    <line x1="200" y1="160" x2="200" y2="352" />
    <line x1="256" y1="130" x2="256" y2="382" />
    <line x1="312" y1="160" x2="312" y2="352" />
    <line x1="362" y1="200" x2="362" y2="312" />
    <line x1="412" y1="256" x2="412" y2="340" />
  </g>

  <!-- Main "GP" Text with Gradient & Glow -->
  <text x="256" y="275" font-family="'Montserrat', 'Arial Black', sans-serif" font-size="160" font-weight="900" fill="url(#textGrad)" text-anchor="middle" filter="url(#glow)" letter-spacing="4">GP</text>

  <!-- Subtitle Text "PRO" -->
  <text x="256" y="345" font-family="'Montserrat', sans-serif" font-size="32" font-weight="800" fill="#00D4FF" text-anchor="middle" letter-spacing="8">STAGE PRO</text>

  <!-- Accent Bottom Border Line -->
  <rect x="120" y="380" width="272" height="6" rx="3" fill="#A78BFA" opacity="0.8"/>
</svg>
